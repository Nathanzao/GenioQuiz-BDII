{% raw %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Prompt Generator</title>
    <style>
        body {font-family: Arial, sans-serif; margin: 2rem; background:#f5f5f5;}
        .container {max-width: 800px; margin:auto; background:white; padding:2rem; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.1);}
        h1 {text-align:center; margin-bottom:1rem;}
        .logo {display:block; margin:0 auto 1rem; width:120px;}
        form {margin-bottom:2rem;}
        textarea {width:100%; font-family:inherit; font-size:1rem; padding:0.5rem; border:1px solid #ccc; border-radius:4px;}
        input[type="file"] {margin-top:0.5rem;}
        button {background:#0066cc; color:white; border:none; padding:0.6rem 1.2rem; border-radius:4px; cursor:pointer; font-size:1rem;}
        button:hover {background:#004999;}
        .prompt-card {border:1px solid #e0e0e0; border-radius:6px; padding:1rem; margin-bottom:1rem; background:#fafafa;}
        .prompt-card img {max-width:180px; display:block; margin-top:0.5rem; border-radius:4px;}
    </style>
</head>
<body>
    <div class="container">
        <img src="{{ url_for('static', filename='ai.svg') }}" alt="AI logo" class="logo"/>
        <h1>Prompt Generator</h1>
        <form method="post" enctype="multipart/form-data">
            <label for="prompt">Prompt text</label><br>
            <textarea name="prompt" id="prompt" rows="4" required></textarea><br><br>
            <label for="image">Upload image (optional)</label><br>
            <input type="file" name="image" id="image" accept="image/*"><br><br>
            <button type="submit">Save</button>
        </form>
        <hr>
        <h2>Saved prompts</h2>
        {% for row in prompts %}
        <div class="prompt-card">
            <p><strong>Prompt:</strong> {{ row['text']|e }}</p>
            {% if row['image_path'] %}
            <img src="{{ url_for('static', filename=row['image_path']) }}" alt="uploaded image">
            {% endif %}
        </div>
        {% endfor %}
    </div>
</body>
</html>
{% endraw %}
